name: github-linux


on:
  push:
    paths:
    - .github/**
    - Build/**
    - Source/**
  workflow_call:
    inputs:
      ref:
        description: Exact commit approved by the PR security gate
        required: true
        type: string


concurrency:
  group: linux-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  linux-intel-intelmpi:
    # build on ubuntu using ifort with intelmpi and mkl based on
    # https://github.com/oneapi-src/oneapi-ci

    name: linux intel intelmpi
    runs-on: [ubuntu-latest]

    steps:
    - uses: marcfehling/setup-oneapi@v0
      with:
        components: |
          ifx@2026.1.0
          impi@2021.18.0
          mkl@2026.1.0
        prune: false       
         
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false

    - name: build fds debug
      run: |
        source /opt/intel/oneapi/setvars.sh
        cd ./Build/impi_intel_linux_db
        ./make_fds.sh
        ./fds_impi_intel_linux_db

    - name: build fds release
      run: |
        source /opt/intel/oneapi/setvars.sh
        cd ./Build/impi_intel_linux
        ./make_fds.sh
        ./fds_impi_intel_linux


  linux-gnu-openmpi:
    # build on ubuntu using gfortran with openmpi and mkl based on
    # https://github.com/oneapi-src/oneapi-ci

    name: linux gnu openmpi
    runs-on: [ubuntu-latest]
    env:
      UBUNTU_MIRRORS: |
        http://azure.archive.ubuntu.com/ubuntu
        http://archive.ubuntu.com/ubuntu
        http://mirrors.edge.kernel.org/ubuntu
        http://mirrors.mit.edu/ubuntu
        http://mirror.math.princeton.edu/pub/ubuntu
        http://ubuntu.osuosl.org/ubuntu

    steps:
    - name: install openmpi
      run: |
        # Check Ubuntu's signed indexes before choosing a mirror.
        root=()
        if [ "$EUID" -ne 0 ]; then root=(sudo); fi
        sources=/etc/apt/sources.list.d/ubuntu.sources
        if [ ! -f "$sources" ]; then sources=/etc/apt/sources.list; fi
        original_sources=$(cat "$sources")
        mirror_ready=false
        for mirror in $UBUNTU_MIRRORS; do
          echo "Trying Ubuntu mirror: $mirror"
          # Handle both direct Ubuntu URLs and the hosted runner's mirror-list URI.
          printf '%s\n' "$original_sources" |
            sed -E "s@(https?://([[:alnum:].-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?|mirror\+file:/etc/apt/apt-mirrors\.txt)@$mirror/@g" |
            "${root[@]}" tee "$sources" > /dev/null
          if "${root[@]}" timeout --kill-after=5s 90s apt-get \
            -o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts="-" \
            -o APT::Update::Error-Mode=any -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          then
            echo "Using Ubuntu mirror: $mirror"
            echo "Ubuntu mirror: $mirror" >> "$GITHUB_STEP_SUMMARY"
            mirror_ready=true
            break
          fi
          echo "::warning title=Ubuntu mirror unavailable::$mirror could not supply the package indexes; continuing to the next mirror."
        done
        if [ "$mirror_ready" != true ]; then
          echo "::error title=Ubuntu dependency setup unavailable::None of the six mirrors supplied the package indexes. FDS was not built."
          exit 1
        fi
        sudo apt-get -y install libopenmpi-dev openmpi-bin
    - uses: marcfehling/setup-oneapi@v0
      with:
        components: |
          mkl@2025.1.0
        prune: false  

    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - name: build fds debug
      run: |
        source /opt/intel/oneapi/setvars.sh
        cd ./Build/ompi_gnu_linux_db
        ./make_fds.sh
        ./fds_ompi_gnu_linux_db
    - name: build fds release
      run: |
        source /opt/intel/oneapi/setvars.sh
        cd ./Build/ompi_gnu_linux
        ./make_fds.sh
        ./fds_ompi_gnu_linux


  linux-python-helloworld:
    # Run Hello World test

    name: linux python helloworld
    runs-on: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: |
        echo $GITHUB_WORKSPACE
        cd $GITHUB_WORKSPACE/Utilities/Python
        source setup_python_env.sh --batchmode

    - name: PR security regression tests
      run: python3 -m unittest discover -s .github/security -p 'test_*.py' -v

    - name: Python test
      run: |
        echo $GITHUB_WORKSPACE
        cd $GITHUB_WORKSPACE/Utilities/Python
        source $GITHUB_WORKSPACE/.github/fds_python_env/bin/activate
        python hello_world.py
        : # python FDS_verification_script.py
