name: PR security

# Trusted policy only. PR files are scanned as data and never executed here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  author:
    name: Check PR author
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      head_repo: ${{ steps.prepare.outputs.head_repo }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      merge_sha: ${{ steps.prepare.outputs.merge_sha }}
      trusted: ${{ steps.prepare.outputs.trusted }}
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          # Only the receiving repository's trusted revision is checked out here.
          allow-unsafe-checkout: true
      - name: Admit listed authors immediately; leave others pending
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/security/pr_security.py prepare

  scan:
    name: Virus scan
    needs: author
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Keep the scanner isolated from jobs that can publish admission statuses.
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          allow-unsafe-checkout: true
      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam
          clamscan --version
      - name: Scan PR files as data
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ needs.author.outputs.head_repo }}
          HEAD_SHA: ${{ needs.author.outputs.head_sha }}
          MERGE_SHA: ${{ needs.author.outputs.merge_sha }}
        run: python3 .github/security/pr_security.py scan

  result:
    name: Report virus scan
    needs: [author, scan]
    if: always() && needs.author.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          allow-unsafe-checkout: true
      - name: Report scan and admit other authors only on success
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.author.outputs.head_sha }}
          BASE_SHA: ${{ needs.author.outputs.base_sha }}
          MERGE_SHA: ${{ needs.author.outputs.merge_sha }}
          TRUSTED: ${{ needs.author.outputs.trusted }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: python3 .github/security/pr_security.py finish
